# 熊猫相册 Nginx 配置
# 文件位置：/etc/nginx/sites-available/lightforever.net
# 创建软链接：sudo ln -s /etc/nginx/sites-available/lightforever.net /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name lightforever.net www.lightforever.net;

    # 网站根目录
    root /var/www/lightforever.net;
    index index.html index.htm;

    # 日志
    access_log /var/log/nginx/lightforever.net_access.log;
    error_log /var/log/nginx/lightforever.net_error.log;

    # 广告 API
    location /api/ {
        alias /var/www/lightforever.net/api/;
        
        # PHP 支持（如果服务器有 PHP）
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    # APK 下载
    location /download/ {
        alias /var/www/lightforever.net/download/;
        types {
            application/vnd.android.package-archive apk;
        }
        # 允许下载
        add_header Content-Disposition 'attachment; filename="$1"';
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 默认位置
    location / {
        try_files $uri $uri/ =404;
    }
}

